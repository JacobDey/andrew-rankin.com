<!doctype html>
<html lang="en-CA" data-game="shared:dither">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dither · dev · shared</title>
  <script>
    (function () {
      var d = document.documentElement, lock = d.getAttribute('data-scheme-lock'), t = null;
      try { t = localStorage.getItem('ar:theme'); } catch (e) {}
      var q = /[?&]theme=(light|dark)\b/.exec(location.search);
      if (q) t = q[1];
      if (lock === 'light' || lock === 'dark') t = lock;
      if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
      if (/[?&]motion=reduce\b/.test(location.search)) d.setAttribute('data-motion', 'reduce');
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0a09; color: #e6dfcb; font: 13px/1.4 ui-monospace, Consolas, monospace; }
    #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; overscroll-behavior: none; }
    #c { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    #panel { position: fixed; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: min(560px, calc(100vw - 16px)); }
    #panel button { font: inherit; padding: 6px 10px; min-height: 36px; background: #1d1a17; color: inherit; border: 1px solid #4a443b; border-radius: 3px; cursor: pointer; }
    #panel button[aria-pressed="true"] { background: #e6dfcb; color: #141210; }
    #hud { position: fixed; left: 8px; bottom: 8px; background: rgba(11,10,9,.8); padding: 4px 8px; border-radius: 3px; }
    #cpu { position: fixed; right: 8px; top: 8px; width: 256px; height: 96px; image-rendering: pixelated; border: 1px solid #4a443b; }
  </style>
</head>
<body>
  <main id="stage" tabindex="-1"><canvas id="c"></canvas></main>
  <div id="panel">
    <button data-pal="bone" aria-pressed="true">bone</button>
    <button data-pal="ruby" aria-pressed="false">ruby</button>
    <button data-pal="latentTerminal" aria-pressed="false">latentTerminal</button>
    <button id="sweep">palette sweep</button>
    <button id="outline" aria-pressed="true">outlines</button>
    <button data-pat="bluenoise" aria-pressed="true">blue noise</button>
    <button data-pat="bayer" aria-pressed="false">bayer</button>
    <button data-pat="bayer-ign" aria-pressed="false">bayer+ign</button>
    <button data-pat="cluster" aria-pressed="false">cluster</button>
  </div>
  <canvas id="cpu" width="256" height="96" aria-label="CPU dithered gradient"></canvas>
  <div id="hud"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
