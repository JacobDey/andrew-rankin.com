<!doctype html>
<html lang="en-CA" data-game="shared-photochem">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Shared · dev · photochem</title>
  <style>
    html, body { margin: 0; background: #14110f; color: #e8e0d2; font: 13px/1.4 ui-monospace, 'IBM Plex Mono', Consolas, monospace; }
    main { padding: 12px 16px 24px; max-width: 1180px; margin: 0 auto; }
    h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
    p.sub { margin: 0 0 12px; color: #a39a8c; }
    .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
    figure { margin: 0; }
    figcaption { margin-top: 4px; color: #a39a8c; max-width: 340px; }
    canvas { display: block; background: #000; border: 1px solid #3a342e; image-rendering: pixelated; }
    pre { margin: 12px 0 0; white-space: pre-wrap; color: #cfc6b6; }
    pre.fail { color: #ff9b8a; }
  </style>
</head>
<body data-grain="off">
  <main id="stage" tabindex="-1">
    <h1>@shared/photochem dev page</h1>
    <p class="sub">A wedge print developing under a scripted rock, a cyanotype from coat to peroxide, a film negative and its print. Drive it with <code>__game.demo(name)</code>, <code>__game.selftest()</code>, <code>__game.bench()</code>.</p>
    <div class="row">
      <figure><canvas id="wedge" width="256" height="320"></canvas><figcaption id="wedgeCap">wedge print</figcaption></figure>
      <figure><canvas id="cyano" width="256" height="320"></canvas><figcaption id="cyanoCap">cyanotype</figcaption></figure>
      <figure><canvas id="neg" width="384" height="256"></canvas><figcaption id="negCap">film negative</figcaption></figure>
      <figure><canvas id="print" width="384" height="256"></canvas><figcaption id="printCap">print</figcaption></figure>
    </div>
    <pre id="out"></pre>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
