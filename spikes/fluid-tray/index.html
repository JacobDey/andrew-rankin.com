<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Spike: fluid tray</title>
  <style>
    :root {
      --ink: #f3d9c8;
      --dim: #b07a60;
      --safelight: #ff7148;
      --film: #120806;
      --tape: #d9cfae;
      color-scheme: dark;
    }
    html, body { margin: 0; height: 100%; background: #070302; color: var(--ink); overflow: hidden;
      font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #stage canvas.dragging { cursor: grabbing; }
    .glow { position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(60% 45% at 8% -6%, rgba(255, 90, 40, 0.16), transparent 70%),
        radial-gradient(120% 90% at 50% 50%, transparent 58%, rgba(0, 0, 0, 0.55) 100%); }
    .room .glow { background: radial-gradient(120% 90% at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.35) 100%); }
    header { position: fixed; left: 16px; top: calc(12px + env(safe-area-inset-top)); pointer-events: none; max-width: min(420px, 60vw); }
    header .tape { display: inline-block; background: var(--tape); color: #1a1410; padding: 4px 10px 3px; transform: rotate(-1.2deg);
      font: 700 18px/1.1 "Marker Felt", "Comic Sans MS", cursive; box-shadow: 0 1px 0 rgba(0,0,0,.4); }
    header p { margin: 8px 0 0; color: var(--dim); font-size: 12px; text-shadow: 0 1px 2px #000; }
    #stats { position: fixed; right: 12px; top: calc(12px + env(safe-area-inset-top)); font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
      color: var(--dim); background: rgba(10, 4, 2, 0.6); padding: 6px 8px; border-radius: 6px; white-space: pre; pointer-events: none; }
    #bar { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 6px;
      justify-content: center; padding: 0 12px; pointer-events: none; }
    #bar button, #bar label, #bar select { pointer-events: auto; background: rgba(18, 8, 6, 0.82); color: var(--ink); border: 1px solid rgba(255, 113, 72, 0.35);
      border-radius: 6px; padding: 9px 12px; font: 600 13px system-ui, sans-serif; min-height: 40px; touch-action: none; cursor: pointer; }
    #bar button.on { background: var(--safelight); color: #1a0804; border-color: var(--safelight); }
    #bar button:active { transform: translateY(1px); }
    #bar input[type=file] { display: none; }
    #maps { position: fixed; left: 12px; bottom: calc(66px + env(safe-area-inset-bottom)); display: none; gap: 6px; flex-direction: column; pointer-events: none; }
    #maps.show { display: flex; }
    #maps figure { margin: 0; background: rgba(10, 4, 2, 0.7); padding: 4px; border-radius: 4px; }
    #maps canvas { display: block; width: 150px; image-rendering: pixelated; }
    #maps figcaption { font: 10px ui-monospace, monospace; color: var(--dim); margin-top: 2px; }
    #toast { position: fixed; left: 50%; bottom: calc(70px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--film); color: var(--ink);
      padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .16s; pointer-events: none; font-weight: 500; }
    #toast.show { opacity: 1; }
    @media (max-width: 640px) {
      header p { display: none; }
      #stats { font-size: 9px; opacity: 0.85; }
      #bar button, #bar label, #bar select { padding: 8px 9px; font-size: 12px; }
      header .tape { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="glow"></div>
  <header>
    <span class="tape">Rock the tray.</span>
    <p>Drag anywhere to lift an edge and let go to drop it. Hold the jug (or Pour) to add developer. Drag far toward a corner, or hold Tip out, to empty it through the spout.</p>
  </header>
  <div id="stats"></div>
  <div id="maps">
    <figure><canvas id="mapCov"></canvas><figcaption>coverage (liquid on paper)</figcaption></figure>
    <figure><canvas id="mapDev"></canvas><figcaption>development</figcaption></figure>
    <figure><canvas id="mapFresh"></canvas><figcaption>developer freshness (tray)</figcaption></figure>
  </div>
  <div id="bar">
    <button id="bPour" title="Hold to pour (P)">Pour</button>
    <button id="bTip" title="Hold to tip out through the spout (D)">Tip out</button>
    <button id="bRock" title="Rock the tray for me (R)">Rock</button>
    <button id="bNudge" title="Shove the tray (J)">Nudge</button>
    <button id="bFinger" title="Finger in the liquid (F, or right-drag)">Finger</button>
    <button id="bGyro" title="Tilt the phone to tilt the tray" hidden>Phone is the tray</button>
    <button id="bLight" title="Room light (L)">Room light</button>
    <button id="bSheet" title="Fresh sheet of the same negative">New sheet</button>
    <button id="bFill" title="Empty the tray and refill">Refill</button>
    <label title="Expose your own picture onto the next sheet">Load PNG<input id="fPng" type="file" accept="image/*" /></label>
    <button id="bSave" title="Save state">Save</button>
    <button id="bLoad" title="Back to saved state">Load</button>
    <button id="bMaps" title="Show the maps (M)">Maps</button>
    <select id="sQual" title="Quality">
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
