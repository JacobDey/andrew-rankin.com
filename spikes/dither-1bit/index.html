<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121110" />
  <title>Spike: 1-bit dither</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <canvas id="c" aria-label="1-bit dithered ship's cabin darkroom. Drag to look around."></canvas>

  <header class="bar">
    <span class="title">ONE-BIT <em>spike</em></span>
    <nav class="stations" aria-label="Stations">
      <button data-station="0" class="on">1 Cabin</button>
      <button data-station="1">2 Tray</button>
      <button data-station="2">3 Camera</button>
      <button data-station="3">4 Plates</button>
      <button data-station="4">5 Loupe</button>
    </nav>
    <button id="toggle" aria-expanded="false" aria-controls="panel">Controls</button>
  </header>

  <aside id="panel" hidden>
    <div class="row"><label>Anchor</label>
      <div class="seg" data-key="mode">
        <button data-v="sphere" class="on">Sphere</button><button data-v="world">World</button><button data-v="screen">Screen</button><button data-v="none">None</button>
      </div>
    </div>
    <div class="row"><label>Sphere centre</label>
      <div class="seg" data-key="centre">
        <button data-v="point" class="on">Anchor point</button><button data-v="camera">Camera</button>
      </div>
    </div>
    <div class="row"><label>Pattern</label>
      <div class="seg" data-key="pattern">
        <button data-v="bluenoise" class="on">Blue noise</button><button data-v="bayer">Bayer 8</button><button data-v="cluster">Halftone</button>
      </div>
    </div>
    <div class="row"><label>Palette</label>
      <select id="palette"></select>
    </div>
    <div class="row"><label>Pixels</label>
      <div class="seg" data-key="scale">
        <button data-v="auto" class="on">Auto</button><button data-v="1">1×</button><button data-v="2">2×</button><button data-v="3">3×</button><button data-v="4">4×</button>
      </div>
    </div>
    <div class="row"><label>Outline</label>
      <div class="seg" data-key="outline">
        <button data-v="auto" class="on">Auto</button><button data-v="ink">Ink</button><button data-v="off">Off</button>
      </div>
    </div>
    <div class="row"><label>Seams</label>
      <div class="seg" data-key="seams">
        <button data-v="on" class="on">Line IDs</button><button data-v="off">Off</button>
      </div>
    </div>
    <div class="row"><label>Print grain</label>
      <div class="seg" data-key="grain">
        <button data-v="surface" class="on">On paper</button><button data-v="global">Global</button>
      </div>
    </div>
    <div class="row"><label>Emulsion</label>
      <div class="seg" data-key="luma">
        <button data-v="rec709" class="on">Eye</button><button data-v="plate">Blue-sens.</button><button data-v="ortho">Ortho</button>
      </div>
    </div>
    <div class="row tone"><label>Tone</label>
      <span class="mini"><small>exp</small><input id="exposure" type="range" min="0.3" max="4" step="0.05" value="1.6" aria-label="Exposure" /></span>
      <span class="mini"><small>gamma</small><input id="gamma" type="range" min="1" max="2.6" step="0.05" value="1.4" aria-label="Gamma" /></span>
      <span class="mini"><small>contrast</small><input id="contrast" type="range" min="0.6" max="2.5" step="0.05" value="1.5" aria-label="Contrast" /></span>
    </div>
    <div class="row"><label>View</label>
      <div class="seg" data-key="view">
        <button data-v="final" class="on">1-bit</button><button data-v="split">Split</button><button data-v="tone">Tone</button><button data-v="edges">Edges</button><button data-v="normals">Normals</button>
      </div>
    </div>
    <div class="row"><label>Quality</label>
      <div class="seg" data-key="quality">
        <button data-v="high">High</button><button data-v="mid">Mid</button><button data-v="low">Low</button>
      </div>
    </div>
    <div class="row actions">
      <button id="develop">Develop</button>
      <input id="devslider" type="range" min="0" max="2" step="0.01" value="0" aria-label="Development" />
      <button id="storm">Storm</button>
      <label class="file">Import PNG<input id="file" type="file" accept="image/*" /></label>
      <button id="swim">Swim test</button>
    </div>
    <pre id="out" aria-live="polite"></pre>
  </aside>

  <div id="hud" aria-live="off"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
